# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: CMake on a single platform

on:
  workflow_dispatch:
  push:
    branches: [ "pick4PR" ]

permissions:
  contents: write
  
env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  sync-and-build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: upstream-master-action
        token: ${{ secrets.GITHUB_TOKEN }}
        submodules: recursive  
          
    - name: Rebase action onto pick4PR
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git fetch origin pick4PR upstream-master-action
        git checkout upstream-master-action
        
        git rebase origin/pick4PR
        git push origin upstream-master-action --force-with-lease
    
    - name: Download d3dx9.lib
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "third_party\d3dx9\lib"

        Invoke-WebRequest `
          -Uri "https://raw.githubusercontent.com/jyanf/Custom_SokuLib/dev/lib/d3dx9.lib" `
          -OutFile "third_party\d3dx9\lib\d3dx9.lib"
    - name: Configure CMake
      shell: pwsh
      run: |
        cmake -S . -B out/build -G "Visual Studio 17 2022" -A Win32 `
          -DCMAKE_MODULE_LINKER_FLAGS="/DEFAULTLIB:${{ github.workspace }}\third_party\d3dx9\lib\d3dx9.lib" `
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}\install"
    - name: Build
      shell: pwsh
      run: |
        cmake --build out/build --config Release --verbose

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-release
        path: |
          ${{ github.workspace }}/out/build/**/*.exe
          ${{ github.workspace }}/out/build/**/*.dll
          ${{ github.workspace }}/out/build/**/*.dat
        if-no-files-found: error
